# X-03 (#130) lane config: the served house model (u4, TP2) on the local lane's port 8041,
# with the backlog probe's model name. Everything below the model path is the house served
# config (hy4-u4-tp2-disk.yaml) unchanged, including DFly2 speculation, so a decode row the
# card snapshots is a spec row, which is the case the card's correctness claim is about.
server:
  host: 127.0.0.1
  port: 8041
  log: info
  kernels: libr4d,libavx,spechub
memory:
  gpu-headroom-mib: 128
models:
  hy4-flash:
    model: /home/ubuntu/models/radiance/hy4-flash-iqr-v4/hy4-flash-iqr-v4-u4.rad
    tp: 2
    placement: expert_tiered
    host-pool-mib: 39000
    ngram-placement: disk
    max-model-len: 262144
    max-num-batched-tokens: 2048
    checkpoint-interval: 1984
    max-num-seqs: 8
    mm-max-patches: auto
    vision-tower-placement: ram
    prefix-resume: nearest
    prefix-cache-mib: 16384
    busy-prefill-chunk: auto
    checkpoint-slots: 128
    num-speculative-tokens: 5
    draft-window: fixed
    draft-coupling: on
    draft-verify: traversal
    draft-depth: adaptive
    draft-depth-load: on
    draft-depth-load-from: 1
    draft-suffix: on
    reasoning-effort-map: xhigh=max,medium=max,low=max
    decode-checkpoint-interval: 256