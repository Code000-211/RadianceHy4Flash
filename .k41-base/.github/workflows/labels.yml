# Keeps the difficulty labels of this repository's issues in place.
# Runs when this file changes, or by hand (Actions -> Sync labels -> Run workflow).
name: Sync labels

on:
  push:
    paths: [.github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update difficulty labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "difficulty:easy"   --color 0E8A16 --description "Small, well understood change" --force
          gh label create "difficulty:medium" --color FBCA04 --description "Moderate change, some investigation needed" --force
          gh label create "difficulty:hard"   --color B60205 --description "Large or risky change, deep investigation needed" --force
