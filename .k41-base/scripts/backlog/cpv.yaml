server:
  host: 127.0.0.1
  port: 8041
  log: debug
  kernels: libr4d,libavx,spechub
memory:
  gpu-headroom-mib: 128
models:
  hy4-flash:
    model: /srv/models/hy4-flash-iqr-v4/hy4-flash-iqr-v4-u3.rad
    tp: 2
    placement: expert_tiered
    host-pool-mib: 39000
    ngram-placement: ram
    max-model-len: 65536
    max-num-batched-tokens: 2048
    checkpoint-interval: 1984         # a quantum under the batch: no remainder step sharing a step with decode rows
    max-num-seqs: 8
    mm-max-patches: 0
    prefix-resume: nearest
    prefix-cache-mib: 16384
    busy-prefill-chunk: auto
    num-speculative-tokens: 5
    draft-window: fixed
    draft-coupling: on
    draft-verify: traversal
    draft-depth: adaptive
    draft-depth-stop: 0.3
    draft-depth-load: on
    draft-depth-load-from: 1
    draft-suffix: on
